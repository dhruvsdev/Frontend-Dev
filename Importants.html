<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important elements</title>
</head>
<body>
    <!--Takes full screen width , if an element is present it will shift to next line  -->
    <div id="Header" class="container"> <!--//Generic block-level container-->
        Hello
        <h3>All</h3>
        <p>Make some nooooooiseeee for Keshav Jhaaaaaa</p>
    </div>
    <!--Allows other elements with it in the same line -->
    <p>Hello <span>World</span></p> <!--// Generic inline container-->

</body>
</html>
