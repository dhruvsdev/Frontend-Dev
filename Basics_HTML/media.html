<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <!--Video-->
    <h3>Video</h3>
    <video src="video.mp4" controls width="540" autoplay loop muted poster="img1.png"></video>
    <br>
    <h3>Audio</h3>
    <audio src="audio.mp3" controls loop preload="auto"></audio>
    <!--preload - none - default , does NOT preload audio file and only starts downloading when user initiates playback-->
    <!--Metadata - only preloads the metadata of the audio file such as its duration and basic info -->

    <!--auto - preloads the audio file ASAP without delay in loading other content-->

    <br>
    <h3>SVGs</h3>
    <!--Inline SVG-->
    <svg height="100" width="100">
    <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    <!--img tag SVG-->
    <img src="" alt="">

</svg>

</body>
</html>
