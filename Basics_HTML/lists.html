<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h3>Ordered list</h3>

    <ol> 
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>

    <h3>Unordered list</h3>
    <ul>
        <li>DTU</li>
        <li>NSUT</li>
        <li>IIIT</li>
    </ul>
</body>
</html>
